<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="title">
  <title id="title">whereti</title>
  <!-- for dark backgrounds: white name, a lighter brand gradient on "ti" -->
  <defs>
    <linearGradient id="bg" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2F6BFF"/>
      <stop offset="0.55" stop-color="#4A4BF0"/>
      <stop offset="1" stop-color="#6C2BD9"/>
    </linearGradient>
    <radialGradient id="glow" cx="150" cy="110" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pin" x1="220" y1="150" x2="250" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD66B"/>
      <stop offset="1" stop-color="#FF8A3D"/>
    </linearGradient>
    <linearGradient id="lens" x1="232" y1="120" x2="232" y2="344" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <!-- the "ti" ending in the brand gradient: where-(is)-it -->
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7FA8FF"/>
      <stop offset="1" stop-color="#B38CFF"/>
    </linearGradient>
  </defs>

  <!-- the icon, 256 px -->
  <g transform="translate(32 32) scale(0.5)">
    <rect width="512" height="512" rx="116" fill="url(#bg)"/>
    <rect width="512" height="512" rx="116" fill="url(#glow)"/>
    <circle cx="232" cy="232" r="112" fill="url(#lens)"/>
    <circle cx="232" cy="232" r="112" fill="none" stroke="#FFFFFF" stroke-width="34"/>
    <line x1="318" y1="318" x2="398" y2="398" stroke="#FFFFFF" stroke-width="48" stroke-linecap="round"/>
    <path d="M168 182 A 80 80 0 0 1 226 150" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="12" stroke-linecap="round"/>
    <path d="M232 162 C 200 162 176 186 176 217 C 176 256 214 290 228 302 C 230.4 304 233.6 304 236 302
             C 250 290 288 256 288 217 C 288 186 264 162 232 162 Z" fill="url(#pin)"/>
    <circle cx="232" cy="216" r="20" fill="#FFFFFF"/>
  </g>

  <!-- the name -->
  <text x="330" y="208" font-family="'Segoe UI Variable Display', 'Segoe UI', 'Inter', system-ui, sans-serif"
        font-size="168" font-weight="600" letter-spacing="-5" fill="#FFFFFF">where<tspan fill="url(#word)">ti</tspan></text>
</svg>
