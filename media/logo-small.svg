<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title">
  <title id="title">whereti</title>
  <!-- The logo for 16-32 px (tray, taskbar, small icons): the same drawing
       with thicker lines, a bigger pin, and no glow or shadows, which only
       blur at that size. Larger sizes use logo.svg. -->
  <defs>
    <linearGradient id="bg" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2F6BFF"/>
      <stop offset="0.55" stop-color="#4A4BF0"/>
      <stop offset="1" stop-color="#6C2BD9"/>
    </linearGradient>
    <linearGradient id="pin" x1="220" y1="140" x2="250" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD66B"/>
      <stop offset="1" stop-color="#FF8A3D"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <circle cx="226" cy="226" r="118" fill="none" stroke="#FFFFFF" stroke-width="52"/>
  <line x1="318" y1="318" x2="410" y2="410" stroke="#FFFFFF" stroke-width="68" stroke-linecap="round"/>
  <path d="M226 142 C 186 142 158 172 158 210 C 158 254 202 294 220 309 C 223.5 312 228.5 312 232 309
           C 250 294 294 254 294 210 C 294 172 266 142 226 142 Z" fill="url(#pin)"/>
  <circle cx="226" cy="208" r="26" fill="#FFFFFF"/>
</svg>
