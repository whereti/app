<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>whereti logo</title>
<style>
  body { margin: 0; font-family: "Segoe UI Variable Text", "Segoe UI", sans-serif; background: #F7F7F9; color: #16162B; }
  .row { display: flex; align-items: flex-end; gap: 28px; padding: 24px 32px; }
  .dark { background: #1A1A1D; color: #F0F0F3; }
  .cap { font-size: 12px; opacity: .6; text-align: center; margin-top: 6px; }
  .mono-l { color: #1B1B3A; } .mono-d { color: #FFFFFF; }
  img { display: block; }
</style>
</head>
<body>
  <div class="row">
    <div><img src="logo.svg" width="256" height="256"><div class="cap">256</div></div>
    <div><img src="logo.svg" width="128" height="128"><div class="cap">128</div></div>
    <div><img src="logo.svg" width="48" height="48"><div class="cap">48</div></div>
    <div><img src="logo.svg" width="32" height="32"><div class="cap">32</div></div>
    <div><img src="logo.svg" width="16" height="16"><div class="cap">16</div></div>
    <div><img src="logo-mono.svg" width="48" height="48"><div class="cap">mono 48</div></div>
    <div><img src="logo-mono.svg" width="16" height="16"><div class="cap">mono 16</div></div>
  </div>
  <div class="row dark">
    <div><img src="logo.svg" width="128" height="128"><div class="cap">128 on dark</div></div>
    <div><img src="logo.svg" width="32" height="32"><div class="cap">32</div></div>
    <div><img src="logo-wordmark-dark.svg" width="600" height="160"><div class="cap">wordmark on dark</div></div>
  </div>
  <div class="row">
    <div><img src="logo-wordmark.svg" width="600" height="160"><div class="cap">wordmark</div></div>
  </div>
</body>
</html>
