# cargo-deny: what whereti's dependencies may be (PLAN.md §14).
# `cargo deny check` runs in CI on every push.

[graph]
targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]
all-features = false

[advisories]
# Known vulnerabilities fail the build; unmaintained crates only warn.
version = 2
yanked = "deny"
unmaintained = "workspace"

[licenses]
version = 2
# Permissive licenses only: whereti is MIT and must stay distributable as such.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "CC0-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "bzip2-1.0.6",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
