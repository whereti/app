name: CI

# Every push and pull request: the tests, clippy with warnings as errors, and
# cargo-deny (licenses, known vulnerabilities, sources). Actions are pinned to
# commits, as on silentsilo.com: a tag can be moved, a commit cannot.

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the version in rust-toolchain.toml
      - name: Rust
        run: rustup toolchain install
      # The installer (whereti-setup) packs the release programs and is built
      # by scripts/package.ps1; it is not a default member, so these skip it.
      - name: Tests
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  deny:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cargo-deny
        run: |
          cargo install cargo-deny --locked
          cargo deny check
