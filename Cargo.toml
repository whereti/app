[workspace]
resolver = "2"
members = ["crates/*"]
# The installer packs the release binaries of the others: it is built on its
# own, after them (scripts/package.ps1), never by a plain `cargo build`.
default-members = [
    "crates/whereti-app",
    "crates/whereti-cli",
    "crates/whereti-content",
    "crates/whereti-core",
    "crates/whereti-engine",
    "crates/whereti-extract",
    "crates/whereti-i18n",
    "crates/whereti-ipc",
    "crates/whereti-net",
    "crates/whereti-ntfs",
    "crates/whereti-places",
    "crates/whereti-query",
    "crates/whereti-service",
]

[workspace.package]
version = "0.0.14"
edition = "2021"
license = "MIT"
authors = ["Software Hive S.R.L."]
repository = "https://github.com/whereti/whereti"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1
panic = "abort"
