[package]
name = "whereti-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow"] }
global-hotkey = "0.9.0"
parking_lot = "0.13.0"
raw-window-handle = "0.6"
serde_json = "1.0.154"
tray-icon = "0.26.1"
whereti-extract = { version = "0.0.21", path = "../whereti-extract" }
whereti-i18n = { version = "0.0.21", path = "../whereti-i18n" }
whereti-ipc = { version = "0.0.21", path = "../whereti-ipc" }
whereti-net = { version = "0.0.21", path = "../whereti-net" }
whereti-places = { version = "0.0.21", path = "../whereti-places" }
whereti-query = { version = "0.0.21", path = "../whereti-query" }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_Graphics_Dwm", "Win32_System_SystemServices", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Controls", "Win32_Storage_FileSystem"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Time", "Win32_System_Threading", "Win32_Networking_WinHttp", "Win32_Security_Cryptography", "Win32_Security_WinTrust", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_System_Registry", "Win32_System_Recovery"] }

[[bin]]
name = "whereti"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1.34"
