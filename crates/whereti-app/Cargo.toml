[package]
name = "whereti-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow"] }
global-hotkey = "0.9.0"
raw-window-handle = "0.6"
tray-icon = "0.26.1"
whereti-extract = { version = "0.0.1", path = "../whereti-extract" }
whereti-i18n = { version = "0.0.1", path = "../whereti-i18n" }
whereti-ipc = { version = "0.0.1", path = "../whereti-ipc" }
whereti-query = { version = "0.0.1", path = "../whereti-query" }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_Graphics_Dwm", "Win32_System_SystemServices", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Controls", "Win32_Storage_FileSystem"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Time", "Win32_System_Threading"] }

[[bin]]
name = "whereti"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1.34"
