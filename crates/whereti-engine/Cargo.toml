[package]
name = "whereti-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
parking_lot = "0.13.0"
rayon = "1.12.0"
whereti-content = { version = "0.0.1", path = "../whereti-content" }
whereti-core = { version = "0.0.1", path = "../whereti-core" }
whereti-extract = { version = "0.0.1", path = "../whereti-extract" }
whereti-ipc = { version = "0.0.1", path = "../whereti-ipc" }
whereti-ntfs = { version = "0.0.1", path = "../whereti-ntfs" }
whereti-query = { version = "0.0.1", path = "../whereti-query" }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Time", "Win32_System_SystemInformation", "Win32_System_Power"] }
