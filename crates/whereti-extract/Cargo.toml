[package]
name = "whereti-extract"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
calamine = "0.37.0"
cfb = "0.15.0"
chardetng = "1.0.0"
encoding_rs = "0.8.42"
outlook-pst = "1.2.0"
mail-parser = { version = "0.11.9", features = ["full_encoding"] }
pdf-extract = "0.12.1"
quick-xml = "0.42.0"
whereti-query = { version = "0.0.24", path = "../whereti-query" }
sevenz-rust2 = { version = "0.24.1", default-features = false }
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"] }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-31"] }
windows = { version = "0.62.2", features = ["Data_Pdf", "Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Win32_System_WinRT"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
zip = { version = "9.1.0", default-features = false, features = ["deflate"] }
