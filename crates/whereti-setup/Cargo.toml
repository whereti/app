[package]
name = "whereti-setup"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Installer and uninstaller for whereti (carries the app, the service, the extractor and wt)"

[[bin]]
name = "whereti-setup"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Com", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_SystemInformation"] }
windows-service = "0.8.1"
zstd = { version = "0.14.3", default-features = false }
whereti-i18n = { version = "0.9.4", path = "../whereti-i18n" }

[build-dependencies]
zstd = { version = "0.14.3", default-features = false, features = ["zstdmt"] }
winresource = "0.1.34"
